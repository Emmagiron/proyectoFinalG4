{% extends "base.html" %}

{% block titulo %}Login{% endblock %}

{% block contenido %}
<div class="container mt-5">
    <h2 class="mb-4">Iniciar sesión</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
</div>
{% endblock %}
